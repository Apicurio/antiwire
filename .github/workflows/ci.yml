name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# Note: paths-ignore is safe while CI is not a required status check; if it
# becomes one, replace it with a no-op success job for docs-only changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
      - name: Assert zero non-JDK compile/runtime dependencies
        # The enforcer rule allows listed test libraries in any scope; this check pins the
        # scope invariant exactly: only io.apicurio reactor modules may appear at compile or
        # runtime scope of the two SHIPPED modules. The dependency lists were written by the
        # list-dependencies execution during mvn verify above; the never-published parity
        # fixture wire-upstream-shaded is exempt and simply not inspected.
        run: |
          deps=$(cat wire-runtime-java/target/deps.txt wire-schema-java/target/deps.txt \
            | grep -E ':(compile|runtime)( |$)' | grep -v 'io\.apicurio' || true)
          if [ -n "$deps" ]; then
            echo "Non-reactor compile/runtime dependencies found:"; echo "$deps"; exit 1
          fi
