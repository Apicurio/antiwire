name: ci

# Build and verification for the antiwire port. The claims this workflow supports are exactly
# the ACTIVE suites in config/verify-suites.json that scripts/verify.sh runs and reconciles;
# parity evidence beyond them lives in the docs/ ledgers.
#
# One job, two toolchains, one execution: Maven runs on Temurin 17 while a Temurin 11
# toolchain is exported as JAVA_HOME_11_X64, and scripts/verify.sh runs every suite,
# including java11-consumer, on that real JDK 11 inside this same job. There is no second
# consumer job and no artifact upload or download.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run on main: republishes the snapshot before Central's 90-day cleanup (DEC-18).
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: build and verification entry point (JDK 17 build, JDK 11 consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 11 is installed first so that the final JAVA_HOME and PATH stay on 17 while the
      # 11 toolchain is exported as JAVA_HOME_11_X64; scripts/verify.sh discovers it there and
      # runs the consumer smoke on it (DEC-3: consumer checks run on an actual Java 11 JVM).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # TASK-14: the parity-coverage suite needs the pinned upstream clone; cache it per
      # tag so reconciliation runs against the exact sources the pins name.
      - uses: actions/cache@v4
        with:
          path: ~/antiwire-upstream
          key: upstream-${{ hashFiles('config/parity-pins.json') }}
      - name: fetch the pinned upstream clone
        run: scripts/fetch-upstream.sh "$HOME/antiwire-upstream"

      # Offline script-level regression checks (stubbed mvn, synthetic upstream): the
      # verify.sh clone prerequisite, the parity-gate negative probes and the release
      # gate state matrix. They need no network and run before the build so a broken
      # gate script fails the job early.
      - name: run the script regression checks
        run: |
          scripts/test-bootstrap.sh
          scripts/test-parity-gate.sh
          scripts/test-release-gates.sh

      - name: run the verification entry point
        run: ANTIWIRE_UPSTREAM="$HOME/antiwire-upstream" scripts/verify.sh

  # DEC-18: after a green build of main, publish the -SNAPSHOT to the Central Portal snapshot
  # repository. Without the two secrets below it only prints a notice and succeeds.
  publish-snapshot:
    name: publish the -SNAPSHOT to the Central Portal snapshot repository
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    env:
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
    steps:
      - name: skip when the Central Portal token is not configured
        if: env.CENTRAL_TOKEN_USERNAME == ''
        run: echo "::notice::Snapshot publishing skipped; the CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD secrets are not set (DEC-18)."
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: central-portal-snapshots
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-
      - name: deploy the snapshot (tests ran in build-and-verify)
        if: env.CENTRAL_TOKEN_USERNAME != ''
        run: mvn -B -ntp -P publish-snapshots -DskipTests deploy
